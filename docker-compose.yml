services:

  # =========================================================
  # KAFKA
  # =========================================================
  kafka:
    image: apache/kafka:latest
    container_name: streampulse-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Internal Docker listener + external Windows listener
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      # Docker containers use kafka:29092
      # Windows/host applications use localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

  # =========================================================
  # POSTGRESQL
  # =========================================================
  postgres:
    image: postgres:16
    container_name: streampulse-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: streampulse
      POSTGRES_USER: streampulse
      POSTGRES_PASSWORD: streampulse_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =========================================================
  # REDIS
  # =========================================================
  redis:
    image: redis:7
    container_name: streampulse-redis
    ports:
      - "6379:6379"

  # =========================================================
  # FASTAPI
  # =========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: streampulse-api
    container_name: streampulse-api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: streampulse
      DB_USER: streampulse
      DB_PASSWORD: streampulse_password

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

  # =========================================================
  # SPARK STREAMING
  # =========================================================
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark

    image: streampulse-spark
    container_name: streampulse-spark

    environment:
      PYTHONPATH: /app

      # Kafka inside Docker
      KAFKA_HOST: kafka:29092

      # PostgreSQL inside Docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: streampulse
      DB_USER: streampulse
      DB_PASSWORD: streampulse_password

      # Redis inside Docker
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./data:/app/data

    working_dir: /app

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - src/streaming/spark_stream.py

    depends_on:
      - kafka
      - postgres
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: streampulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: streampulse-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

# ===========================================================
# VOLUMES
# ===========================================================
volumes:
  postgres_data: